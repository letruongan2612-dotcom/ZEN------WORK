<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEN WORK · Trảng Bom II</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #E8F5E9; font-family: 'Plus Jakarta Sans', sans-serif; color: #1B3B2B; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: #ffffff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(27,59,43,0.06); }
        h1 { font-family: 'Oswald', sans-serif; font-size: 28px; color: #1B3B2B; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #557A64; margin-bottom: 24px; font-size: 15px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 14px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px 16px; border: 1px solid #C8E6C9; border-radius: 8px; font-size: 16px; outline: none; background: #F1F8E9; }
        input:focus { border-color: #2E7D32; background: #fff; }
        button { background: #2E7D32; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #1B5E20; }
        .error { color: #D32F2F; font-size: 13px; margin-top: 8px; }
        .logout-btn { background: #E0E0E0; color: #333; margin-top: 20px; }
        .logout-btn:hover { background: #BDBDBD; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [pin, setPin] = React.useState("");
            const [user, setUser] = React.useState(null);
            const [error, setError] = React.useState("");

            // Danh sách nhân viên và mã PIN tương ứng (Bạn có thể đổi số PIN tùy ý ở đây)
            const staffList = {
                "1111": { name: "Nguyễn Trung Tín", shift: "Ca Sáng" },
                "2222": { name: "Lương Hiểu Nguyên", shift: "Ca Sáng" },
                "3333": { name: "Đoàn Mộng Chân", shift: "Ca Sáng" },
                "4444": { name: "Đặng Sỹ Tú", shift: "Ca Sáng" },
                "5555": { name: "Nguyễn Ngọc Bảo Trân", shift: "Ca Sáng" },
                "6666": { name: "Nguyễn Ngọc Bảo Anh", shift: "Ca Sáng" },
                "9999": { name: "Quản Lý (Admin)", shift: "Toàn quyền" }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (staffList[pin]) {
                    setUser(staffList[pin]);
                    setError("");
                } else {
                    setError("Mã PIN không chính xác. Vui lòng kiểm tra lại.");
                }
            };

            if (!user) {
                return (
                    <div className="container">
                        <div className="card" style={{ maxWidth: "400px", margin: "60px auto", textAlign: "center" }}>
                            <div style={{ fontSize: "12px", letterSpacing: "2px", color: "#2E7D32", fontWeight: "700", marginBottom: "8px" }}>ZEN WORK</div>
                            <h1>TRẢNG BOM II</h1>
                            <p>Nhập mã PIN cá nhân để xem công việc của bạn.</p>
                            <form onSubmit={handleLogin}>
                                <div className="form-group">
                                    <input 
                                        type="password" 
                                        maxLength="4" 
                                        placeholder="Nhập mã PIN 4 số..." 
                                        value={pin}
                                        onChange={(e) => setPin(e.target.value)}
                                        style={{ textAlign: "center", letterSpacing: "8px", fontSize: "20px" }}
                                        autoFocus
                                    />
                                </div>
                                {error && <div className="error">{error}</div>}
                                <button type="submit" style={{ marginTop: "12px" }}>Đăng nhập</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="card">
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid #E0E0E0", paddingBottom: "16px", marginBottom: "20px" }}>
                            <div>
                                <div style={{ fontSize: "12px", color: "#2E7D32", fontWeight: "700" }}>XIN CHÀO</div>
                                <h1 style={{ margin: 0, fontSize: "22px" }}>{user.name}</h1>
                            </div>
                            <span style={{ background: "#C8E6C9", color: "#1B5E20", padding: "4px 12px", borderRadius: "20px", fontSize: "13px", fontWeight: "600" }}>{user.shift}</span>
                        </div>

                        {user.name === "Quản Lý (Admin)" ? (
                            <div>
                                <p>Khu vực quản trị hệ thống: Xem và phân quyền toàn bộ nhân sự, công việc và lỗi vi phạm.</p>
                                {/* Thêm nội dung trang quản lý của bạn tại đây */}
                            </div>
                        ) : (
                            <div>
                                <p>Dưới đây là danh sách công việc và lỗi vi phạm được giao riêng cho bạn:</p>
                                <div style={{ background: "#F1F8E9", padding: "20px", borderRadius: "12px", border: "1px dashed #A5D6A7", textAlign: "center", color: "#557A64" }}>
                                    Chưa có công việc hoặc lỗi vi phạm nào được ghi nhận.
                                </div>
                            </div>
                        )}

                        <button className="logout-btn" onClick={() => { setUser(null); setPin(""); }}>Đăng xuất</button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
